name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload binaries to
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            suffix: ""
            agent: x86_64
          - architecture: x86
            target: i686-pc-windows-msvc
            suffix: -x86
            agent: x86
          - architecture: ARM64
            target: aarch64-pc-windows-msvc
            suffix: -arm64
            agent: arm64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build winstats and the agent
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p winstats-agent

      - name: Stage release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/winstats.exe' 'staging/winstats${{ matrix.suffix }}.exe'
          Copy-Item 'target/${{ matrix.target }}/release/winstats-agent.exe' 'staging/winstats-agent-windows-${{ matrix.agent }}.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: staging/*
          retention-days: 1

  agent:
    name: Agent ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl) so one binary runs on any distribution
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true
          # both macOS builds run on Apple silicon; the Intel one is a cross build (the Intel
          # runners are gone)
          - name: macos-x86_64
            runner: macos-14
            target: x86_64-apple-darwin
            musl: false
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin
            musl: false

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} -p winstats-agent

      - name: Stage release binary
        run: |
          mkdir staging
          cp 'target/${{ matrix.target }}/release/winstats-agent' 'staging/winstats-agent-${{ matrix.name }}'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: staging/*
          retention-days: 1

  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: [windows, agent]

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.tag || github.event.release.tag_name }}'
          ls -l artifacts
          gh release upload --repo '${{ github.repository }}' "$tag" artifacts/* --clobber
