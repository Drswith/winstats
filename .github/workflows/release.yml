name: Release binaries

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload binaries to
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    runs-on: windows-2025

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            target: x86_64-pc-windows-msvc
            suffix: ""
            agent: x86_64
          - architecture: x86
            target: i686-pc-windows-msvc
            suffix: -x86
            agent: x86
          - architecture: ARM64
            target: aarch64-pc-windows-msvc
            suffix: -arm64
            agent: arm64

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build winstats and the agent
        run: |
          cargo build --release --target ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }} -p winstats-agent

      - name: Stage release binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging | Out-Null
          Copy-Item 'target/${{ matrix.target }}/release/winstats.exe' 'staging/winstats${{ matrix.suffix }}.exe'
          Copy-Item 'target/${{ matrix.target }}/release/winstats-agent.exe' 'staging/winstats-agent-windows-${{ matrix.agent }}.exe'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.architecture }}
          path: staging/*
          retention-days: 1

  agent:
    name: Agent ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds are static (musl) so one binary runs on any distribution
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            musl: true

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Add the Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build the agent
        run: cargo build --release --target ${{ matrix.target }} -p winstats-agent

      - name: Stage release binary
        run: |
          mkdir staging
          cp 'target/${{ matrix.target }}/release/winstats-agent' 'staging/winstats-agent-${{ matrix.name }}'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-${{ matrix.name }}
          path: staging/*
          retention-days: 1

  # both macOS builds run on Apple silicon (the Intel one is a cross build, the Intel runners are
  # gone): the two bare executables as before, and one universal winstats-agent.app, which gives
  # the agent a name and an icon in Login Items and the "background item added" notice
  agent-macos:
    name: Agent macOS
    runs-on: macos-14

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Add the Rust targets
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Build the agent
        run: |
          cargo build --release --target x86_64-apple-darwin -p winstats-agent
          cargo build --release --target aarch64-apple-darwin -p winstats-agent

      - name: Stage release binaries and the app
        run: |
          mkdir staging
          cp target/x86_64-apple-darwin/release/winstats-agent staging/winstats-agent-macos-x86_64
          cp target/aarch64-apple-darwin/release/winstats-agent staging/winstats-agent-macos-arm64
          crates/agent/macos/bundle.sh staging target/x86_64-apple-darwin/release/winstats-agent target/aarch64-apple-darwin/release/winstats-agent

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-macos
          path: staging/*
          retention-days: 1

  upload:
    name: Upload release assets
    runs-on: ubuntu-latest
    needs: [windows, agent, agent-macos]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # winstats as bare exes plus one zip per architecture (the exe as winstats.exe with README
      # and LICENSE); every agent in one zip, packed here on Linux so the Unix ones keep +x
      - name: Pack release assets
        run: |
          tag='${{ inputs.tag || github.event.release.tag_name }}'
          version="${tag#v}"
          mkdir release
          cp artifacts/winstats.exe artifacts/winstats-x86.exe artifacts/winstats-arm64.exe release/
          for pair in amd64: x86:-x86 arm64:-arm64; do
            name="${pair%%:*}"
            suffix="${pair#*:}"
            dir="pack-$name"
            mkdir "$dir"
            cp "artifacts/winstats$suffix.exe" "$dir/winstats.exe"
            cp README.md LICENSE "$dir/"
            (cd "$dir" && zip -9 -q "../release/winstats-$version-$name.zip" winstats.exe README.md LICENSE)
          done
          mkdir agents
          cp artifacts/winstats-agent-* agents/
          cp -R artifacts/winstats-agent.app agents/
          chmod +x agents/winstats-agent-linux-* agents/winstats-agent-macos-* agents/winstats-agent.app/Contents/MacOS/winstats-agent
          cp README.md LICENSE agents/
          (cd agents && zip -9 -q -r "../release/winstats-agent-$version.zip" *)
          ls -l release

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.tag || github.event.release.tag_name }}'
          gh release upload --repo '${{ github.repository }}' "$tag" release/* --clobber
