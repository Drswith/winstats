[package]
name = "winstats-metrics"
version = "0.3.0"
edition = "2021"
rust-version = "1.77"
license = "MIT"
publish = false

[dependencies]
serde = { version = "=1.0.210", features = ["derive"] }
serde_json = "=1.0.128"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.58.0", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }
